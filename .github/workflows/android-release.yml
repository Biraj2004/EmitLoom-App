name: Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Plan release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_PUSH: ${{ github.event.before }}
        run: python3 .github/scripts/android-release.py plan

      - uses: actions/setup-java@v4
        if: steps.plan.outputs.version != ''
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.plan.outputs.version != ''

      - name: Test and lint
        if: steps.plan.outputs.version != ''
        run: bash gradlew :app:testDebugUnitTest :app:lintRelease

      - name: Build and verify signed APK
        if: steps.plan.outputs.version != ''
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          VERSION_CODE: ${{ steps.plan.outputs.version_code }}
          KEYSTORE_BASE64: ${{ secrets.EMITLOOM_KEYSTORE_BASE64 }}
          EMITLOOM_STORE_PASSWORD: ${{ secrets.EMITLOOM_STORE_PASSWORD }}
          EMITLOOM_KEY_ALIAS: ${{ secrets.EMITLOOM_KEY_ALIAS }}
          EMITLOOM_KEY_PASSWORD: ${{ secrets.EMITLOOM_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$EMITLOOM_STORE_PASSWORD" || -z "$EMITLOOM_KEY_ALIAS" || -z "$EMITLOOM_KEY_PASSWORD" ]]; then
            echo '::error::Configure the four EmitLoom signing secrets listed in docs/RELEASING.md.'
            exit 1
          fi

          umask 077
          EMITLOOM_KEYSTORE=$(mktemp "$RUNNER_TEMP/emitloom-release.XXXXXX.p12")
          export EMITLOOM_KEYSTORE
          trap 'rm -f -- "$EMITLOOM_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$EMITLOOM_KEYSTORE"
          unset KEYSTORE_BASE64

          bash gradlew :app:assembleRelease --no-daemon \
            -PemitloomVersionName="$VERSION" -PemitloomVersionCode="$VERSION_CODE"

          apk="apk-export/emitloom-v$VERSION-release.apk"
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          "$build_tools/apksigner" verify "$apk"
          badging=$("$build_tools/aapt2" dump badging "$apk")
          grep -F "package: name='com.emitloom.app' versionCode='$VERSION_CODE' versionName='$VERSION'" <<< "$badging"

      - name: Publish APK and release notes
        if: steps.plan.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          PREVIOUS: ${{ steps.plan.outputs.previous }}
        run: python3 .github/scripts/android-release.py publish
